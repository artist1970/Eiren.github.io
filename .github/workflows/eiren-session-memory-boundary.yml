name: Eiren Public Chat Consent Memory Boundary
on:
  push:
    branches: [main]
    paths:
      - 'eiren-conversation-v1.js'
      - 'eiren-literary-coach-v2.js'
      - 'index.html'
      - 'styles/eiren-landing-refinement-v1.css'
      - 'tests/eiren-session-memory-boundary.test.mjs'
      - 'tests/eiren-literary-coach-v2.test.mjs'
      - '.github/workflows/eiren-session-memory-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/eiren-session-memory-boundary.test.mjs tests/eiren-literary-coach-v2.test.mjs
