name: Eiren Public Knowledge Regression
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/public-qa.v1.json'
      - 'eiren-public-knowledge-v1.js'
      - 'eiren-conversation-v1.js'
      - 'eiren-rhyme-thesaurus-v1.js'
      - 'knowledge/rhyming-thesaurus.v1.json'
      - 'tests/eiren-rhyme-thesaurus.test.mjs'
      - 'creative-spark-mentor-qa-v1.js'
      - 'tests/mentor-qa-federation-integration.test.mjs'
      - 'creative-spark-mentor-language-v1.js'
      - 'tests/mentor-language-adapter.test.mjs'
      - 'tests/eiren-public-knowledge.test.mjs'
      - 'tests/eiren-conversation-real-transcript.test.mjs'
      - '.github/workflows/eiren-public-knowledge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eiren knowledge and safety regression
        run: node --test tests/eiren-public-knowledge.test.mjs tests/mentor-language-adapter.test.mjs tests/mentor-qa-federation-integration.test.mjs tests/eiren-conversation-real-transcript.test.mjs tests/eiren-rhyme-thesaurus.test.mjs
